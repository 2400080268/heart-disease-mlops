services:
  trainer:
    build: .
    command: ["python", "scripts/run_pipeline.py"]
    volumes:
      - .:/app
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      trainer:
        condition: service_completed_successfully

  streamlit:
    build: .
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

  mlflow:
    build: .
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:////app/mlflow.db", "--host", "0.0.0.0", "--port", "5000", "--workers", "1"]
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      trainer:
        condition: service_completed_successfully
